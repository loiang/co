schema_version = 2

[project]
description = "Codex fork 生命周期管理"
doc_target = "command:co"
tags = ["co"]

[capabilities.upgrade]
command_path = ["upgrade"]
category = "governance"
description = "创建、完成并验证 upstream 升级 candidate"
doc_target = "command:co-upgrade"
tags = ["governance", "upgrade"]
transport = "argv"
operation_id = "upgrade"
program = "python3"
args = ["scripts/co/cli.py", "upgrade", "--repo", "."]
cwd = "repo"
risk = "repository-write"
confirmation = "required"

[[capabilities.upgrade.parameters]]
id = "revision"
kind = "positional"
help = "待合并的 upstream revision"
value_type = "string"
value_name = "REVISION"
required = false
repeatable = false
aliases = []
conflicts_with = []
normalized_key = "revision"

[[capabilities.upgrade.parameters]]
id = "ni-repo"
kind = "option"
help = "ni consumer checkout 路径"
value_type = "string"
value_name = "PATH"
required = false
repeatable = false
aliases = []
conflicts_with = []
normalized_key = "ni-repo"

[[capabilities.upgrade.parameters]]
id = "cores"
kind = "option"
help = "Nix build 使用的 CPU core 数量，零表示全部"
value_type = "integer"
value_name = "N"
required = false
repeatable = false
aliases = []
conflicts_with = []
normalized_key = "cores"

[capabilities.upgrade-finalize]
command_path = ["upgrade-finalize"]
category = "governance"
description = "完成保留在 candidate worktree 中的 upstream 合并"
doc_target = "command:co-upgrade-finalize"
tags = ["governance", "upgrade-finalize"]
transport = "argv"
operation_id = "upgrade-finalize"
program = "python3"
args = ["scripts/co/cli.py", "upgrade-finalize", "--repo", "."]
cwd = "repo"
risk = "repository-write"
confirmation = "required"

[[capabilities.upgrade-finalize.parameters]]
id = "upstream-rev"
kind = "option"
help = "已合并的 upstream commit"
value_type = "string"
value_name = "REV"
required = true
repeatable = false
aliases = []
conflicts_with = []
normalized_key = "upstream-rev"

[[capabilities.upgrade-finalize.parameters]]
id = "ni-repo"
kind = "option"
help = "ni consumer checkout 路径"
value_type = "string"
value_name = "PATH"
required = false
repeatable = false
aliases = []
conflicts_with = []
normalized_key = "ni-repo"

[[capabilities.upgrade-finalize.parameters]]
id = "cores"
kind = "option"
help = "Nix build 使用的 CPU core 数量，零表示全部"
value_type = "integer"
value_name = "N"
required = false
repeatable = false
aliases = []
conflicts_with = []
normalized_key = "cores"

[capabilities.promote]
command_path = ["promote"]
category = "governance"
